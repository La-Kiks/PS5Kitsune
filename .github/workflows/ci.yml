name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml builds the shipped files with this workflow, passing the tag's version.
  workflow_call:
    inputs:
      version:
        description: Version stamped into the builds (default 0.0.0-ci.<run number>)
        type: string
        required: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VERSION: ${{ inputs.version || format('0.0.0-ci.{0}', github.run_number) }}

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux keeps Core free of Windows dependencies from day one.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # setup-dotnet downloads from dotnetorigin.blob.core.windows.net, which answers 409 since 2026-10-25.
      - name: Install .NET from builds.dotnet.microsoft.com
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.ps1 -MaximumRetryCount 3 -RetryIntervalSec 5 -OutFile "$env:RUNNER_TEMP/dotnet-install.ps1"
          & "$env:RUNNER_TEMP/dotnet-install.ps1" -JSonFile global.json -InstallDir "$env:USERPROFILE/.dotnet" -AzureFeed https://builds.dotnet.microsoft.com/dotnet
          "$env:USERPROFILE/.dotnet" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "DOTNET_ROOT=$env:USERPROFILE/.dotnet" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Install .NET from builds.dotnet.microsoft.com
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 3 --retry-delay 5 https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --jsonfile global.json --install-dir "$HOME/.dotnet" --azure-feed https://builds.dotnet.microsoft.com/dotnet
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
      - run: dotnet build PS5Kitsune.slnx -c Release
      - run: dotnet test --solution PS5Kitsune.slnx -c Release --no-build
      # What Linux ships: the app and the CLI in one AppImage. A Windows-only dependency fails here.
      - name: Build the AppImage
        if: runner.os == 'Linux'
        run: |
          version="$VERSION"
          sh packaging/linux/build-appimage.sh "$version"
          image="artifacts/appimage/PS5Kitsune-$version-x86_64.AppImage"
          "./$image" --appimage-extract-and-run --version | grep -F "$version"
          cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$image" --appimage-extract > /dev/null
          test -x squashfs-root/usr/bin/PS5Kitsune && test -x squashfs-root/usr/bin/ps5kitsune
      - name: Upload the AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: PS5Kitsune-linux-x64-AppImage
          path: artifacts/appimage/*.AppImage
      - name: Publish the Windows app
        if: runner.os == 'Windows'
        run: dotnet publish src/PS5Kitsune.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=${{ env.VERSION }} -o artifacts/windows
      - name: Upload the Windows app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: PS5Kitsune-win-x64
          path: artifacts/windows/PS5Kitsune.exe

  licenses:
    name: License check (shipped packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # See the build job: setup-dotnet's download source answers 409.
      - name: Install .NET from builds.dotnet.microsoft.com
        run: |
          curl -fsSL --retry 3 --retry-delay 5 https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --jsonfile global.json --install-dir "$HOME/.dotnet" --azure-feed https://builds.dotnet.microsoft.com/dotnet
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
      - run: dotnet tool restore
      - run: dotnet restore PS5Kitsune.slnx
      # PS5Kitsune is GPL-2.0-only: everything shipped must be GPLv2-compatible.
      # Test projects are excluded because they are never distributed (xUnit is Apache-2.0).
      - run: dotnet nuget-license -i PS5Kitsune.slnx -t -exclude-projects "*Tests*" -a build/allowed-licenses.json -err

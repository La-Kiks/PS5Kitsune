name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux keeps Core free of Windows dependencies from day one.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # setup-dotnet downloads from dotnetorigin.blob.core.windows.net, which answers 409 since 2026-10-25.
      - name: Install .NET from builds.dotnet.microsoft.com
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.ps1 -MaximumRetryCount 3 -RetryIntervalSec 5 -OutFile "$env:RUNNER_TEMP/dotnet-install.ps1"
          & "$env:RUNNER_TEMP/dotnet-install.ps1" -JSonFile global.json -InstallDir "$env:USERPROFILE/.dotnet" -AzureFeed https://builds.dotnet.microsoft.com/dotnet
          "$env:USERPROFILE/.dotnet" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "DOTNET_ROOT=$env:USERPROFILE/.dotnet" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Install .NET from builds.dotnet.microsoft.com
        if: runner.os == 'Linux'
        run: |
          curl -fsSL --retry 3 --retry-delay 5 https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --jsonfile global.json --install-dir "$HOME/.dotnet" --azure-feed https://builds.dotnet.microsoft.com/dotnet
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
      - run: dotnet build PS5Kitsune.slnx -c Release
      - run: dotnet test --solution PS5Kitsune.slnx -c Release --no-build
      # What Linux ships: a self-contained CLI. A Windows-only dependency in it fails here.
      - name: Publish the Linux CLI
        if: runner.os == 'Linux'
        run: dotnet publish src/PS5Kitsune.Cli -c Release -r linux-x64 --self-contained -o "$RUNNER_TEMP/cli-linux"

  licenses:
    name: License check (shipped packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # See the build job: setup-dotnet's download source answers 409.
      - name: Install .NET from builds.dotnet.microsoft.com
        run: |
          curl -fsSL --retry 3 --retry-delay 5 https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --jsonfile global.json --install-dir "$HOME/.dotnet" --azure-feed https://builds.dotnet.microsoft.com/dotnet
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
      - run: dotnet tool restore
      - run: dotnet restore PS5Kitsune.slnx
      # PS5Kitsune is GPL-2.0-only: everything shipped must be GPLv2-compatible.
      # Test projects are excluded because they are never distributed (xUnit is Apache-2.0).
      - run: dotnet nuget-license -i PS5Kitsune.slnx -t -exclude-projects "*Tests*" -a build/allowed-licenses.json -err
